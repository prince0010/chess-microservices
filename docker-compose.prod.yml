version: "3.7"

services:
  # NATS
  nats:
    image: nats:latest
    container_name: nats-prod
    networks:
      - chess_production

  # Container advisor - google HTTP lightweight metric
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    expose:
      - "8080" # with expose it is not public
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    restart: always
    networks:
      - chess_production

  # Prometheus
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    expose:
      - "9090" # with expose it is not public
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    privileged: true
    depends_on:
      - cadvisor
    networks:
      - chess_production

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "3015:3000"
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - DS_PROMETHEUS=prometheus
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml"
      - "./dashboard.json:/var/lib/grafana/dashboards/dashboard.json"
      - "./default.yaml:/etc/grafana/provisioning/dashboards/default.yaml"
    privileged: true
    depends_on:
      - prometheus
    networks:
      - chess_production

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode yes
    expose:
      - "6379" # Internal Docker access only, not public
    volumes:
      - ./redis-data:/data
    networks:
      - chess_production

  # Permission to uploads folder
  fix-uploads:
    image: alpine:3.20
    container_name: fix-uploads
    command: >
      sh -c "chown -R 1000:1000 /uploads &&
             chmod -R 775 /uploads"
    volumes:
      - ./chess-gateway/uploads:/uploads
    restart: "no"
    networks:
      - chess_production

  # Gateway-MS
  chess-gateway:
    container_name: chess-gateway-prod
    build:
      context: ./chess-gateway
      dockerfile: Dockerfile.prod
    image: we-chess-gateway-prod
    ports:
      - ${CHESS_GATEWAY_PORT}:${CHESS_GATEWAY_PORT}
    environment:
      - PORT=${CHESS_GATEWAY_PORT}
      - PORT=${CHESS_GATEWAY_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./chess-gateway/public:/usr/src/app/public
      - ./chess-gateway/uploads:/usr/src/app/uploads
    depends_on:
      - redis
    networks:
      - chess_production

  # Auth-ms
  auth-ms:
    container_name: auth-ms-prod
    build:
      context: ./chess-auth-ms
      dockerfile: Dockerfile.prod
    image: we-chess-auth-ms-prod
    restart: always
    depends_on: [auth-mariadb]
    environment:
      PORT: ${AUTH_MS_PORT}
      NATS_SERVERS: "${NATS_SERVERS}"
      MARIADB_VERSION: ${MARIADB_VERSION}
      AUTH_MARIADB_CONTAINER_NAME: ${AUTH_MARIADB_CONTAINER_NAME}
      AUTH_CONTAINER_NAME: ${AUTH_CONTAINER_NAME}
      AUTH_DB_PORT: ${AUTH_DB_PORT}
      AUTH_DB_HOST: ${AUTH_DB_HOST}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WE_CHESS_EMAIL_USERNAME: ${WE_CHESS_EMAIL_USERNAME}
      WE_CHESS_EMAIL_PASSWORD: ${WE_CHESS_EMAIL_PASSWORD}
    volumes:
      - ./seed:/usr/src/app/seed
    networks:
      - chess_production

  lesson-ms:
    container_name: lesson-ms-prod
    build:
      context: ./chess-lesson-ms
      dockerfile: Dockerfile.prod
    image: we-chess-lesson-ms-prod
    restart: always
    depends_on: [lesson-mariadb]
    environment:
      PORT: ${LESSON_MS_PORT}
      NATS_SERVERS: "${NATS_SERVERS}"
      MARIADB_VERSION: ${MARIADB_VERSION}
      LESSON_MARIADB_CONTAINER_NAME: ${LESSON_MARIADB_CONTAINER_NAME}
      LESSON_CONTAINER_NAME: ${LESSON_CONTAINER_NAME}
      LESSON_DB_PORT: ${LESSON_DB_PORT}
      LESSON_DB_HOST: ${LESSON_DB_HOST}
      LESSON_DB_NAME: ${LESSON_DB_NAME}
      LESSON_DB_ROOT_PASSWORD: ${LESSON_DB_ROOT_PASSWORD}
      LESSON_DB_USERNAME: ${LESSON_DB_USERNAME}
      LESSON_DB_PASSWORD: ${LESSON_DB_PASSWORD}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./chess-lesson-ms/files:/usr/src/app/files
    networks:
      - chess_production

  game-ms:
    container_name: game-ms-prod
    build:
      context: ./chess-game-ms
      dockerfile: Dockerfile.prod
    image: we-chess-game-ms-prod
    restart: always
    depends_on: [game-mariadb]
    environment:
      PORT: ${GAME_MS_PORT}
      NATS_SERVERS: "${NATS_SERVERS}"
      MARIADB_VERSION: ${MARIADB_VERSION}
      GAME_MARIADB_CONTAINER_NAME: ${GAME_MARIADB_CONTAINER_NAME}
      GAME_CONTAINER_NAME: ${GAME_CONTAINER_NAME}
      GAME_DB_PORT: ${GAME_DB_PORT}
      GAME_DB_HOST: ${GAME_DB_HOST}
      GAME_DB_NAME: ${GAME_DB_NAME}
      GAME_DB_ROOT_PASSWORD: ${GAME_DB_ROOT_PASSWORD}
      GAME_DB_USERNAME: ${GAME_DB_USERNAME}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD}
    volumes:
      - ./chess-game-ms/files:/usr/src/app/files
    networks:
      - chess_production

  payment-ms:
    container_name: payment-ms-prod
    build:
      context: ./chess-payment-ms
      dockerfile: Dockerfile.prod
    image: we-chess-payment-ms-prod
    restart: always
    depends_on: [payment-mariadb]
    environment:
      PORT: ${PAYMENT_MS_PORT}
      NATS_SERVERS: "${NATS_SERVERS}"
      MARIADB_VERSION: ${MARIADB_VERSION}
      PAYMENT_MARIADB_CONTAINER_NAME: ${PAYMENT_MARIADB_CONTAINER_NAME}
      PAYMENT_CONTAINER_NAME: ${PAYMENT_CONTAINER_NAME}
      PAYMENT_DB_PORT: ${PAYMENT_DB_PORT}
      PAYMENT_DB_HOST: ${PAYMENT_DB_HOST}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      PAYMENT_DB_ROOT_PASSWORD: ${PAYMENT_DB_ROOT_PASSWORD}
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      STRIPE_SECRET_API_KEY: ${STRIPE_SECRET_API_KEY}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      STRIPE_ENDPOINT_SECRET: ${STRIPE_ENDPOINT_SECRET}
    ports:
      - "${PAYMENT_MS_PORT}:${PAYMENT_MS_PORT}"
    networks:
      - chess_production

  auth-mariadb:
    image: "mariadb:${MARIADB_VERSION:-10.11.2}"
    container_name: ${AUTH_MARIADB_CONTAINER_NAME:-auth-mariadb-prod}
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_DB_NAME}
      MARIADB_USER: ${AUTH_DB_USERNAME}
      MARIADB_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "63311:3306"
    restart: always
    networks:
      - chess_production
    volumes:
      - ./chess-auth-ms/auth-mysql-data:/var/lib/mysql

  lesson-mariadb:
    image: "mariadb:${MARIADB_VERSION:-10.11.2}"
    container_name: ${LESSON_MARIADB_CONTAINER_NAME:-lesson-mariadb-prod}
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${LESSON_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${LESSON_DB_NAME}
      MARIADB_USER: ${LESSON_DB_USERNAME}
      MARIADB_PASSWORD: ${LESSON_DB_PASSWORD}
    ports:
      - "63312:3306"
    restart: always
    networks:
      - chess_production
    volumes:
      - ./chess-lesson-ms/lesson-mysql-data:/var/lib/mysql

  game-mariadb:
    image: "mariadb:${MARIADB_VERSION:-10.11.2}"
    container_name: ${GAME_MARIADB_CONTAINER_NAME:-game-mariadb-prod}
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${GAME_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${GAME_DB_NAME}
      MARIADB_USER: ${GAME_DB_USERNAME}
      MARIADB_PASSWORD: ${GAME_DB_PASSWORD}
    ports:
      - "63313:3306"
    restart: always
    networks:
      - chess_production
    volumes:
      - ./chess-game-ms/game-mysql-data:/var/lib/mysql

  payment-mariadb:
    image: "mariadb:${MARIADB_VERSION:-10.11.2}"
    container_name: ${PAYMENT_MARIADB_CONTAINER_NAME:-payment-mariadb-prod}
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${PAYMENT_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PAYMENT_DB_NAME}
      MARIADB_USER: ${PAYMENT_DB_USERNAME}
      MARIADB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "63314:3306"
    restart: always
    networks:
      - chess_production
    volumes:
      - ./chess-payment-ms/payment-mysql-data:/var/lib/mysql

networks:
  chess_production:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"

volumes:
  grafana-data:
